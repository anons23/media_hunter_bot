name: Media Hunter tests

on:
  push:
    branches: [Media_hanter-v3-security]
  pull_request:
    branches: [Media_hanter-v3-security]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r media_hunter_bot/requirements.txt
      - name: Compile
        run: python -m py_compile media_hunter_bot/processor.py media_hunter_bot/handlers.py media_hunter_bot/db.py media_hunter_bot/config.py main.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
