name: Verify v3

on:
  push:
    branches: [Media_hanter-v3]

permissions:
  contents: write

jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Media_hanter-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python modules
        run: python -m py_compile main.py media_hunter_bot/*.py
      - name: Verify imports
        env:
          BOT_TOKEN: test-token
          ADMIN_ID: '1'
        run: |
          pip install -q -r media_hunter_bot/requirements.txt
          python -c 'import media_hunter_bot.handlers; import media_hunter_bot.db; import media_hunter_bot.processor'
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-v3.yml
          git commit -m 'test(v3): verify syntax and imports [skip ci]'
          git push origin HEAD:Media_hanter-v3
